<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairsight Kompetanseutvelgelse</title>


<style>
body{
font-family:Segoe UI, Arial, sans-serif;
background:#ece9ff;
margin:0;
padding:30px;
}


.container{
max-width:1400px;
margin:auto;
}


.section{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}


.hidden{
display:none;
}


h1{
margin-top:0;
color:#241b63;
}


input, textarea{
width:100%;
padding:12px;
font-size:16px;
margin-top:8px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-family:inherit;
}


textarea{
min-height:120px;
resize:vertical;
}


.primary-btn{
padding:14px 24px;
background:#241b63;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}


.primary-btn:disabled{
opacity:.4;
cursor:not-allowed;
}


.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:25px;
}


@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}


.card{
background:#eceaf2;
padding:20px;
border-radius:12px;
transition:.2s;
position:relative;
}

.check{
width:20px;
height:20px;
position:absolute;
top:15px;
right:15px;
cursor:pointer;
}

.card.selected{
background:#9ff2cb;
}


.top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
}


.title{
font-weight:700;
font-size:24px;
margin-bottom:10px;
}


.summary{
font-size:16px;
line-height:1.5;
}


.toggle{
margin-top:15px;
padding:10px 15px;
border:none;
border-radius:20px;
cursor:pointer;
background:white;
}


.details{
display:none;
margin-top:15px;
padding:15px;
background:white;
border-radius:8px;
line-height:1.6;
}


.status{
margin-top:15px;
font-weight:600;
color:#241b63;
}


.result-box{
background:#f4f4f4;
padding:15px;
border-radius:8px;
margin-bottom:15px;
}


ul{
line-height:1.8;
}
</style>
</head>


<body>


<div class="container">


<!-- SIDE 1 -->


<div id="setupPage" class="section">

<h1>Kompetanseutvelgelse for rekruttering</h1>

<label>Rekrutterers navn</label>
<input id="recruiterName" type="text">

<label>Rekrutterers e-post</label>
<input id="recruiterEmail" type="email">

<label>Stillingstittel</label>
<input id="jobTitle" type="text">

<label>Navn på mottaker</label>
<input id="managerName" type="text">

<label>Mottaker av kompetanseutvalg (e-post)</label>
<input id="managerEmail" type="email">

<label>Kommentar til avdelingsleder (valgfritt)</label>
<textarea id="comment"></textarea>

<button id="generateBtn" class="primary-btn">
Generer skjema
</button>

<div id="generatedSection" class="hidden">

<h2>Lenke</h2>
<textarea id="generatedLink" readonly></textarea>

<h2>Emne</h2>
<textarea id="generatedSubject" readonly></textarea>

<h2>Melding til avdelingsleder</h2>
<textarea id="generatedMessage" readonly></textarea>

<button id="startBtn" class="primary-btn hidden">
Fortsett til kompetanseutvelgelse
</button>

</div>

</div>


<!-- SIDE 2 -->


<div id="selectionPage" class="hidden">


<div class="section">


<h1>Velg de seks viktigste kompetansene</h1>


<p><strong>Stilling:</strong> <span id="jobPreview"></span></p>


<p id="commentPreview"></p>


<div id="status" class="status">
Valgt 0 av 6 kompetanser
</div>


<button id="submitBtn" class="primary-btn" disabled>
Fullfør utvelgelsen
</button>


</div>


<div id="cards" class="grid"></div>


</div>


<!-- SIDE 3 -->


<div id="resultPage" class="section hidden">


<h1>Oppsummering</h1>


<div class="result-box">
<strong>Stilling:</strong>
<div id="resultJob"></div>
</div>


<div class="result-box">
<strong>Avdelingsleder:</strong>
<div id="resultManager"></div>
</div>


<div class="result-box">
<strong>Mottakere av kompetanseutvalg:</strong>
<div id="resultRecipients"></div>
</div>


<div class="result-box">
<strong>Kommentar:</strong>
<div id="resultComment"></div>
</div>


<div class="result-box">
<strong>Valgte kompetanser:</strong>
<ul id="selectedCompetencies"></ul>
</div>


</div>


</div>


<script>


const competencies = [


{
title:"Adaptability & Flexibility",
summary:"Tilpasse atferd til endrede krav og omgivelser",
details:"Tilpasser seg nye situasjoner, omgivelser og krav. Justerer arbeidsmåter, prosesser og tilnærminger når forholdene endrer seg. Tar imot tilbakemeldinger på en konstruktiv måte og bruker dem til læring og forbedring."
},


{
title:"Collaboration",
summary:"Arbeide effektivt sammen med andre",
details:"Søker felles forståelse av mål og prioriteringer. Bidrar aktivt til å nå teamets målsettinger. Deler kunnskap, erfaringer og ideer med kolleger. Kommuniserer utfordringer og problemer på en åpen måte og støtter andre når det er behov."
},


{
title:"Communication",
summary:"Kommunisere effektivt og oppmerksomt",
details:"Kommuniserer tydelig og korrekt både skriftlig og muntlig. Holder godt strukturerte presentasjoner. Tilpasser budskapet til mottakeren og sikrer at informasjonen blir forstått."
},


{
title:"Decision Making",
summary:"Ta riktige beslutninger til riktig tid",
details:"Søker relevant, oppdatert og objektiv informasjon. Vurderer saker fra ulike vinkler og perspektiver. Tar hensyn til konsekvenser og prioriterer mellom alternativer basert på nytte og risiko. Tar beslutninger på en hensiktsmessig og tidsriktig måte."
},


{
title:"Planning & Organizing",
summary:"Planlegge og organisere arbeid på en systematisk måte",
details:"Utarbeider effektive arbeidsplaner som støtter virksomhetens mål. Arbeider strukturert og følger opp fremdrift. Prioriterer oppgaver hensiktsmessig og tilpasser planer når forutsetningene endrer seg."
},


{
title:"Taking Initiative",
summary:"Handle uten å vente på instrukser",
details:"Forutser potensielle utfordringer og ser muligheter for forbedring. Tar initiativ til handling for å nå mål og forbedre situasjoner uten å vente på konkrete instrukser. Bidrar frivillig når det er behov."
},

  
{
title:"Achievement Orientation",
summary:"Arbeide målrettet for å oppnå resultater",
details:"Setter ambisiøse mål og arbeider systematisk for å oppnå dem. Tar ansvar for egne resultater og søker kontinuerlig forbedring av prestasjoner. Viser høy grad av motivasjon for å levere kvalitet og nå målsettinger."
},

  
{
title:"Analyzing Information",
summary:"Analysere og tolke informasjon",
details:"Samler inn, vurderer og tolker relevant informasjon fra ulike kilder. Identifiserer mønstre, sammenhenger og avvik. Trekker velbegrunnede konklusjoner basert på tilgjengelige data og fakta."
},

  
{
title:"Building Relationships",
summary:"Bygge og vedlikeholde relasjoner",
details:"Etablerer tillitsfulle og profesjonelle relasjoner. Skaper gode nettverk og samarbeidsarenaer. Opprettholder kontakt over tid og bidrar til et positivt arbeidsmiljø."
},

  
{
title:"Coaching & Developing Others",
summary:"Utvikle og støtte andre",
details:"Gir konstruktive tilbakemeldinger og veiledning. Hjelper andre med å utvikle ferdigheter og kompetanse. Oppmuntrer til læring, ansvar og kontinuerlig forbedring."
},

  
{
title:"Customer Focus",
summary:"Forstå og møte kundens behov",
details:"Setter kunden i sentrum og søker å forstå deres behov og forventninger. Leverer tjenester og løsninger med høy kvalitet og følger opp for å sikre tilfredshet."
},

  
{
title:"Driving Results",
summary:"Levere resultater",
details:"Setter tydelige mål og arbeider målrettet for å nå dem. Viser utholdenhet ved utfordringer og holder fokus på resultater og kvalitet."
},

  
{
title:"Embracing Change",
summary:"Støtte og drive endring",
details:"Er positiv til endringer og bidrar aktivt i forbedringsprosesser. Tilpasser seg nye arbeidsmetoder og hjelper andre gjennom endringer."
},

  
{
title:"Influencing Others",
summary:"Påvirke og overbevise",
details:"Presenterer argumenter på en tydelig og troverdig måte. Får gjennomslag for ideer og forslag gjennom god kommunikasjon og relasjonsbygging."
},

  
{
title:"Innovation",
summary:"Skape nye ideer og løsninger",
details:"Utforsker nye muligheter og utfordrer etablerte metoder. Bidrar med kreative forslag og omsetter ideer til praktiske løsninger."
},

  
{
title:"Learning Orientation",
summary:"Lære og utvikle seg kontinuerlig",
details:"Søker aktivt ny kunnskap og erfaringer. Reflekterer over egen læring og bruker erfaring til kontinuerlig forbedring."
},

  
{
title:"Managing Conflict",
summary:"Håndtere konflikter konstruktivt",
details:"Tar opp konflikter på en respektfull og ryddig måte. Lytter til ulike perspektiver og bidrar til løsninger som ivaretar relasjoner og mål."
},

  
{
title:"Negotiation",
summary:"Forhandle frem gode løsninger",
details:"Forstår ulike interesser og identifiserer muligheter for kompromiss. Oppnår balanserte resultater gjennom strukturert dialog og samarbeid."
},

  
{
title:"Problem Solving",
summary:"Løse komplekse problemer",
details:"Identifiserer årsaker til utfordringer og utvikler effektive løsninger. Vurderer ulike alternativer og gjennomfører hensiktsmessige tiltak."
},

  
{
title:"Quality Orientation",
summary:"Sikre kvalitet i arbeidet",
details:"Arbeider nøyaktig og systematisk. Følger standarder og prosedyrer og leverer arbeid med høy kvalitet og pålitelighet."
},

  
{
title:"Resilience",
summary:"Håndtere press og motgang",
details:"Bevarer effektivitet og fokus i krevende situasjoner. Kommer raskt tilbake etter tilbakeslag og opprettholder prestasjon over tid."
},

  
{
title:"Resource Management",
summary:"Forvalte ressurser effektivt",
details:"Bruker tid, mennesker og økonomiske ressurser på en hensiktsmessig måte. Prioriterer riktig og sikrer god ressursutnyttelse."
},

  
{
title:"Strategic Thinking",
summary:"Tenke langsiktig og helhetlig",
details:"Ser sammenhenger mellom aktiviteter, mål og virksomhetens retning. Tar beslutninger med utgangspunkt i både kortsiktige og langsiktige konsekvenser."
},

  
{
title:"Team Leadership",
summary:"Lede og motivere team",
details:"Skaper retning og engasjement. Fordeler ansvar tydelig og legger til rette for samarbeid, utvikling og gode resultater i teamet."
},

  
{
title:"Work Standards",
summary:"Opprettholde høye arbeidsstandarder",
details:"Setter høye krav til kvalitet og gjennomføring. Arbeider strukturert og følger opp at oppgaver fullføres i henhold til avtalte standarder."
},

  
{
title:"Utilizing Expertise",
summary:"Bruke kunnskap og erfaring i praksis",
details:"Anvender faglig kompetanse og erfaring på en effektiv måte. Holder seg oppdatert innen eget fagområde og deler kunnskap med andre."
}
  
];


const cards=document.getElementById("cards");


competencies.forEach(item=>{


const card=document.createElement("div");


card.className="card";


card.innerHTML=`


<div class="top">
<div>
<div class="title">${item.title}</div>
<div class="summary">${item.summary}</div>
</div>
<input type="checkbox" class="check">
</div>


<button class="toggle">
Les mer
</button>


<div class="details">
${item.details}
</div>


`;


cards.appendChild(card);

card.addEventListener("click",(e)=>{

if(e.target.classList.contains("toggle")) return;

const checkbox = card.querySelector(".check");

checkbox.checked = !checkbox.checked;

document.querySelectorAll(".card").forEach(c=>{

c.classList.toggle(
"selected",
c.querySelector(".check").checked
);

});

checkbox.dispatchEvent(new Event("change"));

});

});


document.getElementById("generateBtn").addEventListener("click",()=>{

const recruiterName =
document.getElementById("recruiterName").value;

const recruiterEmail =
document.getElementById("recruiterEmail").value;

const jobTitle =
document.getElementById("jobTitle").value;

const managerName =
document.getElementById("managerName").value;

const comment =
document.getElementById("comment").value;

const subject =
`Kompetanseutvelgelse - ${jobTitle}`;

const link =
window.location.origin +
window.location.pathname +
"?job=" + encodeURIComponent(jobTitle) +
"&manager=" + encodeURIComponent(managerName) +
"&recruiter=" + encodeURIComponent(recruiterName) +
"&recruiterEmail=" + encodeURIComponent(recruiterEmail) +
"&comment=" + encodeURIComponent(comment);

const message =
`Hei ${managerName},

Som en del av rekrutteringsprosessen for stillingen ${jobTitle} ønsker jeg at du velger de seks kompetansene som du mener er viktigst for å lykkes i rollen.

Klikk på lenken under for å gjennomføre kompetanseutvelgelsen.

${link}

${comment ? "Kommentar: " + comment : ""}

På forhånd takk for hjelpen.

Vennlig hilsen

${recruiterName}`;

document.getElementById("generatedLink").value = link;
document.getElementById("generatedSubject").value = subject;
document.getElementById("generatedMessage").value = message;

document.getElementById("generatedSection").classList.remove("hidden");

});

document.getElementById("startBtn").addEventListener("click",()=>{

document.getElementById("jobPreview").innerText =
document.getElementById("jobTitle").value;

const comment =
document.getElementById("comment").value;

if(comment){
document.getElementById("commentPreview").innerHTML =
"<strong>Kommentar:</strong> " + comment;
}

document.getElementById("setupPage").classList.add("hidden");
document.getElementById("selectionPage").classList.remove("hidden");


});


const params = new URLSearchParams(window.location.search);

if(params.get("job")){

document.getElementById("jobTitle").value =
params.get("job") || "";

document.getElementById("managerName").value =
params.get("manager") || "";

document.getElementById("recruiterName").value =
params.get("recruiter") || "";

document.getElementById("recruiterEmail").value =
params.get("recruiterEmail") || "";

document.getElementById("comment").value =
params.get("comment") || "";

document.getElementById("jobPreview").innerText =
params.get("job") || "";

if(params.get("comment")){
document.getElementById("commentPreview").innerHTML =
"<strong>Kommentar:</strong> " + params.get("comment");
}

document.getElementById("setupPage").classList.add("hidden");
document.getElementById("selectionPage").classList.remove("hidden");

}
  
const submitBtn=document.getElementById("submitBtn");
const status=document.getElementById("status");


document.addEventListener("change",(event)=>{


if(!event.target.classList.contains("check")) return;


const selected =
document.querySelectorAll(".check:checked");


if(selected.length>6){


event.target.checked=false;


alert("Du kan bare velge 6 kompetanser.");


return;


}


document.querySelectorAll(".card").forEach(card=>{


card.classList.toggle(
"selected",
card.querySelector(".check").checked
);


});


status.innerText=
`Valgt ${selected.length} av 6 kompetanser`;


submitBtn.disabled=
selected.length!==6;


});


submitBtn.addEventListener("click",()=>{


const selected=[];


document.querySelectorAll(".card").forEach(card=>{


if(card.querySelector(".check").checked){


selected.push(
card.querySelector(".title").innerText
);


}


});


document.getElementById("resultJob").innerText =
document.getElementById("jobTitle").value;


document.getElementById("resultManager").innerText =
document.getElementById("managerName").value;


document.getElementById("resultRecipients").innerText =
document.getElementById("recipients").value;


document.getElementById("resultComment").innerText =
document.getElementById("comment").value || "-";


const list =
document.getElementById("selectedCompetencies");


list.innerHTML="";


selected.forEach(item=>{


const li=document.createElement("li");


li.innerText=item;


list.appendChild(li);


});


document.getElementById("selectionPage").classList.add("hidden");
document.getElementById("resultPage").classList.remove("hidden");


});


</script>


</body>
</html>
